[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mudra"
version = "0.1.0"
description = "AI-powered hand gesture recognition engine (computer vision)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Mudra contributors" }]
keywords = ["hand-tracking", "gesture-recognition", "mediapipe", "computer-vision"]

# Phase 1 (live camera) runtime dependencies ONLY.
# scipy / pandas / matplotlib are intentionally excluded until the phase that
# first needs them (dataset analysis, plotting, model training) — see the
# project constitution (v1.1.0), "Dependency footprint".
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "pydantic>=2",
    "rich",
    "typer",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
]
# Mudra Studio (apps/studio/) — the desktop dataset explorer, authorized by the
# project constitution v1.5.0. Declared as an OPTIONAL extra so the engine's
# CLI-only footprint never pulls in Qt.
#
# The upper bound is not cosmetic: PySide6 6.11 declares
# `Requires-Python: >=3.10,<3.15`, so moving the repository past Python 3.14
# requires re-verifying this pin first (specs/006-studio-dataset-explorer/
# research.md, "R2 resolution").
studio = [
    "PySide6>=6.11,<7",
]

[project.scripts]
# `mudra` and `mudra run` resolve to the same Typer app as `python -m engine.main`.
mudra = "engine.main:app"
# `mudra-studio` launches the desktop dataset explorer (apps/studio/).
mudra-studio = "studio.main:main"

[project.urls]
Homepage = "https://github.com/mudra/mudra"

[tool.hatch.build.targets.wheel]
# The engine's source lives at apps/engine/ and installs as the `engine` package,
# alongside its sibling applications apps/capture/ (Flutter) and apps/studio/
# (constitution v1.3.0, v1.5.0).
packages = ["apps/engine", "apps/studio"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["apps/engine", "apps/studio", "tests"]

[tool.ruff.lint]
# Sensible, non-fussy default set: pycodestyle errors/warnings, pyflakes,
# isort, pyupgrade, bugbear, and pydocstyle (Google convention).
select = ["E", "W", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `engine` lives at apps/engine/, so `apps/` must be importable when running the
# suite from a source checkout (the repo root is already on the path for `tests`).
pythonpath = ["apps", "."]
